# Real-time alerts for audit rules, aggregated by syscall.
# Activate after configuring a rule file with args, for example:
# args = LOG_ALERT rules=/etc/audit/audisp-alert.rules
# Without a rule file, every SYSCALL record is treated as rule-triggered.

active = no
path = /sbin/audisp-alert
type = always
args = LOG_ALERT
format = string
